<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ResearchHub app icon. Source of truth: edit this file, then run
       scripts/make-icons.sh to regenerate the PNG, .icns and .ico files.
       Layout follows the macOS icon grid: an 824px tile centred on a 1024px
       canvas. Colours come from the app themes: Terminal canvas/accent and
       the Paper page tone. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26221f"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3ead9"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#4a4541" stroke-width="6"/>

  <!-- stacked notes -->
  <g transform="rotate(10 512 512)">
    <rect x="288" y="246" width="464" height="548" rx="46" fill="#a89b86"/>
  </g>
  <g transform="rotate(-5 512 512)">
    <rect x="272" y="244" width="472" height="548" rx="46" fill="#000000" fill-opacity="0.28" transform="translate(0 14)"/>
    <rect x="272" y="236" width="472" height="548" rx="46" fill="url(#page)"/>
  </g>

  <!-- hand-drawn asterisk marker -->
  <g fill="none" stroke="#ef6f2e" stroke-width="72" stroke-linecap="round">
    <path d="M514 342 Q498 512 508 678"/>
    <path d="M366 424 Q516 498 652 604"/>
    <path d="M360 596 Q506 524 658 430"/>
  </g>
</svg>
